services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: larp
      POSTGRES_USER: larp
      POSTGRES_PASSWORD: larp
    ports:
      - "5432:5432"
    volumes:
      - larp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larp -d larp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  larp_postgres_data:
